name: CI

on:
  pull_request:
    paths-ignore:
      - .agents/**
      - .claude/**
      - .codex/**
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check: ${{ steps.plan.outputs.check }}
      api: ${{ steps.plan.outputs.api }}
      build: ${{ steps.plan.outputs.build }}
      typecheck_args: ${{ steps.plan.outputs.typecheck_args }}
      test_args: ${{ steps.plan.outputs.test_args }}
    steps:
      # The planner diffs against the base, so the checkout needs that commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-changes.mjs >> "$GITHUB_OUTPUT"

  check:
    name: Lint, typecheck, test
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      - run: vp run fmt:check
      - run: vp run lint
      - run: vp run knip
      - if: needs.changes.outputs.typecheck_args != ''
        run: vp run ${{ needs.changes.outputs.typecheck_args }} typecheck
      - run: vp test run scripts
      # API tests run in their own job. They need Postgres, and these don't.
      - if: needs.changes.outputs.test_args != ''
        run: vp run ${{ needs.changes.outputs.test_args }} test

  api:
    name: API tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stacks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/stacks_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      - run: vp run --filter @stacks/api test
      - run: vp run --filter @stacks/api db:seed
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  build:
    name: Build web, api and mobile
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      # The API bundle includes the built web app, so web builds first.
      - run: vp run --filter @stacks/web build
      - run: vp run --filter @stacks/api build
      - run: vp run --filter @stacks/mobile build

  deploy:
    name: Deploy development
    needs: [changes, check, api, build]
    if: >-
      github.event_name == 'push' &&
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      needs.check.result == 'success' &&
      needs.build.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.api.result)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      # Runs can finish out of order, and an older commit must not replace a newer deploy.
      # Migrations go first, so each one has to work with the Worker that is still live.
      - run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo "main has moved on; the newer commit's run deploys it."
            exit 0
          fi
          vp run --filter @stacks/api db:migrate
          vp run deploy
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            https://colorup.stephen-jcombs.workers.dev/api/health
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
