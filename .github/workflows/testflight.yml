name: TestFlight

# Manual only. Each run spends one of the Expo account's monthly iOS builds.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  ship:
    name: Build and submit iOS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      # EXPO_TOKEN is the Expo account that owns this project. Apple signing stays in EAS.
      # --wait keeps the check red when the build or the TestFlight upload fails.
      - name: Ship the production iOS build to TestFlight
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx -y eas-cli@27.4.1 workflow:run .eas/workflows/testflight.yml --non-interactive --wait
