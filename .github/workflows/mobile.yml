name: Mobile

on:
  pull_request:
    paths: &mobile-inputs
      - apps/mobile/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .pnpmfile.cjs
      - .node-version
      - patches/**
      - .github/workflows/mobile.yml
  push:
    branches:
      - main
    paths: *mobile-inputs

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    name: Bundle mobile (iOS + Android JS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      - run: vp run --filter @stacks/mobile build
