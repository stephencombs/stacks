name: Mobile

on:
  pull_request:
    paths: &mobile-inputs
      - apps/mobile/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .pnpmfile.cjs
      - .node-version
      - patches/**
      - .github/workflows/mobile.yml
  push:
    branches:
      - main
    paths: *mobile-inputs

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    name: Bundle mobile (iOS + Android JS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
      # Metro keys its entries by file content, so a cache from an older lockfile is safe.
      # Dependency transforms are most of the bundle; only changed app files miss.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: metro-${{ runner.os }}-
      - run: vp run --filter @stacks/mobile build
