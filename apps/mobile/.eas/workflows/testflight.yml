name: TestFlight

# Store submission here means TestFlight. It does not send the build to App Store review.
on:
  workflow_dispatch: {}

concurrency:
  group: testflight
  queue: single
  cancel_in_progress: false

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production
  submit_ios:
    name: Submit to TestFlight
    type: submit
    needs: [build_ios]
    # Unset APP_VARIANT makes app.config.ts the development app, which has no App Store Connect key.
    env:
      APP_VARIANT: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
