# Signs in, makes a group and a trip from Crew, plays a session in the trip, and finds its result
# on the trip. Needs MAESTRO_CLERK_SECRET_KEY, the development instance's secret key.
appId: com.stephencombs.colorup.preview
name: Sign in and play a trip from Crew
tags:
  - account
onFlowStart:
  - runScript:
      file: scripts/create-clerk-user.js
      env:
        NAME: Alex
        CLERK_SECRET_KEY: ${MAESTRO_CLERK_SECRET_KEY}
onFlowComplete:
  - runScript:
      file: scripts/delete-clerk-user.js
      env:
        CLERK_SECRET_KEY: ${MAESTRO_CLERK_SECRET_KEY}
---
# Amounts follow the device's locale; on iOS this pins it to en-US for the app.
- launchApp:
    clearState: true
    clearKeychain: true
    arguments:
      AppleLocale: en_US
      AppleLanguages: (en)
- extendedWaitUntil:
    visible: "Start or add a session"
    timeout: 60000

# Groups need an account: Crew opens on the welcome until you sign in.
- tapOn: "Crew"
- runFlow: subflows/sign-in.yaml
- extendedWaitUntil:
    visible: "Start a group for the people you play with"
    timeout: 60000

- tapOn: "New group"
# A field's caption and the field share its label, so fields are tapped by id.
- tapOn:
    id: "group-name"
- inputText: "Vegas crew"
- tapOn: "Create group"
- extendedWaitUntil:
    visible: "No trips yet"
    timeout: 30000

# Starting a trip in a second group should use that group's scope. Deleting
# the empty trip returns to its group, and leaving returns to Crew's root.
- back
- tapOn: "Groups"
- tapOn: "New group"
- tapOn:
    id: "group-name"
- inputText: "Audit crew"
- tapOn: "Create group"
- extendedWaitUntil:
    visible: "No trips yet"
    timeout: 30000
- tapOn: "Start a trip"
- tapOn:
    id: "trip-name"
- inputText: "Audit weekend"
- tapOn: "Start trip"
- tapOn: "Audit weekend, going"
- assertVisible: "Audit crew( · .*)?"
- tapOn: "Trip options"
- tapOn: "Delete trip"
- tapOn: "Delete trip"
- extendedWaitUntil:
    visible: "No trips yet"
    timeout: 30000
- assertVisible: "Audit crew"
- scrollUntilVisible:
    element: "Group settings.*"
    direction: DOWN
- tapOn: "Group settings.*"
- tapOn: "Leave group"
- tapOn: "Leave group"
- extendedWaitUntil:
    visible: "Groups"
    timeout: 30000
- tapOn: "Groups"
- assertNotVisible: "Audit crew"
- tapOn: "Vegas crew"

- tapOn: "Start a trip"
- tapOn:
    id: "trip-name"
- inputText: "Vegas weekend"
- tapOn: "Start trip"
- tapOn: "Vegas weekend, going"

- tapOn: "Start a session"
- tapOn: "1"
- tapOn: "0"
- tapOn: "0"
- tapOn:
    id: "sheet-submit"
- extendedWaitUntil:
    visible:
      id: "live-buy-in"
      text: "\\$100"
    timeout: 15000

- tapOn: "Cash out"
- tapOn: "1"
- tapOn: "7"
- tapOn: "0"
- tapOn:
    id: "sheet-submit"
- assertVisible:
    id: "visit-result"
    text: "\\+\\$70"

# The trip counts it once the table syncs: back on the trip, the night shows the win.
- tapOn: "Back to (your play|Play)"
- assertVisible: "Vegas weekend"
- extendedWaitUntil:
    visible:
      id: "night-result"
      text: "You \\+\\$70"
    timeout: 60000

# An existing member cannot claim a guest's identity.
- back
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: "Invite"
          direction: DOWN
      - tapOn: "Invite"
- scrollUntilVisible:
    element: "Add a guest"
    direction: DOWN
- tapOn: "Add a guest"
- tapOn:
    text: "Name"
    index: 0
- inputText: "Jonah"
- tapOn: "Add guest"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Send claim link"
      - copyTextFrom: ".*stacks-preview://claim/[A-Za-z0-9]+.*"
      - back
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Copy link"
      - tapOn: "Invite"
      - tapOn: "Add a guest"
      - longPressOn:
          id: "guest-name"
      - tapOn: "Paste"
      - copyTextFrom:
          id: "guest-name"
      - tapOn: "Close"
- evalScript: ${output.claimLink = maestro.copiedText.match(/stacks-preview:\/\/claim\/[A-Za-z0-9]+/)[0]}
- openLink: ${output.claimLink}
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "You're already in this group"
    timeout: 30000
- assertNotVisible: "Yes, I'm Jonah"
- tapOn: "Open group"

# Signing out from group Stats must return to personal Stats without crashing.
- tapOn: "Stats"
- extendedWaitUntil:
    visible: "Standings"
    timeout: 30000
- tapOn: "You"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Standings"
    timeout: 30000
- extendedWaitUntil:
    visible: "Your stats start here|All games"
    timeout: 30000
