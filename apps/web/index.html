<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1116" />
    <title>Stacks</title>
    <!-- Applies the saved theme before first paint, so a light-mode reload never flashes dark.
         Keep in step with src/lib/theme.ts. -->
    <script>
      try {
        var choice = localStorage.getItem("stacks-theme");
        if (
          choice === "light" ||
          (choice === "system" && matchMedia("(prefers-color-scheme: light)").matches)
        )
          document.documentElement.dataset.theme = "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
