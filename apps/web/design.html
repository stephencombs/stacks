<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stacks design system</title>
    <script>
      var choice = null;
      try {
        choice = localStorage.getItem("stacks-theme");
      } catch {}
      if (
        choice === "dark" ||
        (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
      )
        document.documentElement.dataset.theme = "dark";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/design/main.tsx"></script>
  </body>
</html>
