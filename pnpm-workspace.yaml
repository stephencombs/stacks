packages:
  - apps/*
  - packages/*

# Hold back versions published in the last day; most bad releases are pulled by then.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - "@tsc-rs/typescript"
  - esbuild
  - workerd
  # npm tarballs drop the executable bit; the postinstall only chmods the binary.
  - "@leanspec/cli-darwin-arm64"
  - "@leanspec/cli-darwin-x64"
  - "@leanspec/cli-linux-x64"
  - "@leanspec/cli-windows-x64"
  - "@leanspec/mcp-darwin-arm64"
  - "@leanspec/mcp-darwin-x64"
  - "@leanspec/mcp-linux-x64"
  - "@leanspec/mcp-windows-x64"

# Shared versions. Packages depend on `catalog:` so mobile and api never drift.
catalog:
  expo-application: ^58.1.2
  expo-device: ^58.0.5
  expo-localization: ^58.0.5
  happy-dom: ^21.0.4
  posthog-react-native: ^4.85.1
  "@effect/atom-react": 4.0.5
  "@clerk/backend": 3.25.0
  "@clerk/expo": 4.14.0
  "@effect/platform-node": 4.0.5
  "@effect/sql-pg": 4.0.5
  "@effect/vitest": 4.0.5
  "@types/node": 24.12.4
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  effect: 4.0.5
  knip: 6.34.0
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: npm:@tsc-rs/typescript@0.8.0
  vite-plus: 1.4.0

# The TypeScript compiler and Vite+ can sit outside peer ranges declared by dependencies.
peerDependencyRules:
  allowAny:
    - typescript
    - vite
  allowedVersions:
    vite: "*"

overrides:
  # The patch below points @effect/vitest at vite-plus's bundled vitest. A second vitest
  # instance fails every test file with "Cannot read properties of undefined (reading 'config')".
  "@effect/vitest>vitest": "-"
  # Node-based tests do not use this optional browser peer.
  "vite-plus>playwright": "-"
  # Security fixes these tools' exact pins block. Drop each once the parent ships it.
  "miniflare>undici": 7.30.1
  node-forge: 1.4.1

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: 1.4.0

patchedDependencies:
  "@effect/vitest@4.0.5": patches/@effect__vitest@4.0.5.patch
